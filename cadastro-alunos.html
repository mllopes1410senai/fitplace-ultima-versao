<html lang="pt-br" dir="ltr">
    <head>
        <title>Cadastro de alunos</title>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="assets/css/cadastro-alunos.css">
    </head>
    <body>
        <header class="cabecalho">
            <a class="logo" href="index.html">
                <img src="assets/img/logo.png" alt="Logo Fitplace">
            </a>

            <nav class="menu">
                <a href="gerenciar-alunos.html">ALUNOS</a>
                <a href="biblioteca-exercicios.html">EXERCÍCIOS</a>
                <a href="cadastro-alunos.html">CADASTRO</a>
                <a href="dashboard-instrutor.html">
                    <img src="assets/img/casa.png">
                </a>
            </nav>
        </header>
        <main>
            <!-- Carregamento -->
            <section class="carregamento">
                <div class="primeiro">
                    <p class="selecionado">1</p>
                    <p>Cadastro</p>
                </div>

                <img src="assets/img/barra.png" alt="Barra de carregamento" class="barra">

                <div class="contagem">
                    <p class="numeros">2</p>
                    <p>Plano</p>
                </div>

                <img src="assets/img/barra-falta.png" alt="Barra de carregamento" class="barra">

                <div class="contagem">
                    <p class="numeros">3</p>
                    <p>Pagamento</p>
                </div>
            </section>

            <!-- Banner -->
            <section class="banner">
                <h3>Cadastro de</h3>
                <h4>aluno</h4>
                <p>Preencha o formulário para começar sua jornada</p>
            </section>

            <!-- Formulário -->
            <section class="formulario">
                
                <form>
                    <h3>Informações Pessoais</h3>
                    <input type="text" name="nome" required placeholder=" Nome Completo">
                    <input type="text" name="nascimento" required placeholder=" Data de nascimento">
                    <input type="text" name="genero" required placeholder=" Gênero">
                    <input type="text" name="telefone" required placeholder=" Telefone (DDD + Número)">
                    <input type="text" name="email" required placeholder=" E-mail">
                    <input type="text" name="cpf" required placeholder=" CPF">

                <h3>Endereço</h3>
                    <input type="text" name="cep" required placeholder=" CEP">
                    <input type="text" name="endereco" required placeholder=" Endereço">
                    <input type="text" name="numero" required placeholder=" Número">
                    <input type="text" name="bairro" required placeholder=" Bairro">
                    <input type="text" name="cidade" required placeholder=" Cidade">

                    <a  href="selecionar-planos.html" class="button">Próximo passo</a>
                </form>
            </section>
        </main>
        <footer>
            <img src="assets/img/logo.png" alt="Logo da empresa">
            <p>© Todos os direitos reservados.
                FITPLACE's Academia de Ginástica S/A
                CNPJ XX.XXX.XX/0000-00</p>
        </footer>
        
    </body>
</html>
